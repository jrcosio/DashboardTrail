<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>II Trail Sierra de Peñasagra - Sorteo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .header h1 {
            font-size: 2.5rem;
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 10px rgba(255, 255, 255, 0.3); }
            to { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 255, 255, 0.6); }
        }

        .header h2 {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .control-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: all 0.3s ease;
        }

        .control-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 45px 0 rgba(31, 38, 135, 0.5);
        }

        .control-card h3 {
            color: white;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .range-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .range-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .range-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .range-btn.active {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
        }

        .custom-range {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        .custom-range input {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            color: white;
            width: 100px;
            text-align: center;
        }

        .custom-range input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .main-button {
            background: linear-gradient(45deg, #f093fb, #f5576c);
            border: none;
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
            position: relative;
            overflow: hidden;
        }

        .main-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.6);
        }

        .main-button:active {
            transform: translateY(0);
        }

        .main-button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result-area {
            text-align: center;
            margin: 40px 0;
        }

        .number-display {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 60px;
            margin: 20px 0;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 50px 0 rgba(31, 38, 135, 0.4);
            position: relative;
            overflow: hidden;
        }

        .number-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: rotate 3s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .current-number {
            font-size: 5rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
            animation: pulse 1s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .number-info {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.15);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #4ecdc4;
            margin-bottom: 5px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        .history-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-height: 300px;
            overflow-y: auto;
        }

        .history-title {
            color: white;
            margin-bottom: 15px;
            font-size: 1.2rem;
            text-align: center;
        }

        .history-numbers {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .history-number {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            animation: slideIn 0.5s ease;
            box-shadow: 0 3px 10px rgba(68, 160, 141, 0.3);
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .reset-button {
            background: linear-gradient(45deg, #ff4757, #c44569);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 20px;
            transition: all 0.3s ease;
        }

        .reset-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }

        .spinning {
            animation: numberSpin 1s ease-in-out;
        }

        @keyframes numberSpin {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.2); }
            100% { transform: rotateY(360deg) scale(1); }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f093fb;
            animation: confetti-fall 3s linear infinite;
            z-index: 1000;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: #ffd700;
            z-index: 1001;
            animation: celebrate 2s ease-in-out;
            pointer-events: none;
        }

        @keyframes celebrate {
            0%, 100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .mega-number-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20rem;
            font-weight: 900;
            color: white;
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.8),
                0 0 40px rgba(255, 107, 107, 0.6),
                0 0 60px rgba(138, 43, 226, 0.4),
                0 0 80px rgba(0, 191, 255, 0.3);
            z-index: 1002;
            pointer-events: none;
            animation: megaNumberShow 3s ease-in-out forwards;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #f093fb);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: megaNumberShow 3s ease-in-out forwards, gradientShift 2s ease infinite;
        }

        @keyframes megaNumberShow {
            0% { 
                transform: translate(-50%, -50%) scale(0) rotateY(180deg); 
                opacity: 0; 
            }
            20% { 
                transform: translate(-50%, -50%) scale(1.2) rotateY(0deg); 
                opacity: 1; 
            }
            50% { 
                transform: translate(-50%, -50%) scale(1) rotateY(0deg); 
                opacity: 1; 
            }
            80% { 
                transform: translate(-50%, -50%) scale(1.1) rotateY(0deg); 
                opacity: 1; 
            }
            100% { 
                transform: translate(-50%, -50%) scale(0) rotateY(-180deg); 
                opacity: 0; 
            }
        }

        @media (max-width: 768px) {
            .mega-number-animation {
                font-size: 12rem;
            }
        }

        @media (max-width: 480px) {
            .mega-number-animation {
                font-size: 8rem;
            }
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .current-number { font-size: 3rem; }
            .controls { grid-template-columns: 1fr; }
            .custom-range { flex-direction: column; align-items: stretch; }
            .custom-range input { width: 100%; }
            .main-button { padding: 15px 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="container">
        <div class="header">
            <h1>🏃‍♂️ II Trail Sierra de Peñasagra 🏃‍♀️</h1>
            <h2>Corremos por Adriana - Sorteo de Números</h2>
        </div>

        <div class="controls">
            <div class="control-card">
                <h3>🎯 Rango de Números</h3>
                <div class="range-selector">
                    <button class="range-btn active" onclick="setRange(100)">0-100</button>
                    <button class="range-btn" onclick="setRange(1000)">0-1000</button>
                    <button class="range-btn" onclick="setRange(10000)">0-10000</button>
                </div>
                <div class="custom-range">
                    <span style="color: white;">Personalizado:</span>
                    <input type="number" id="customMin" placeholder="Desde" min="0">
                    <input type="number" id="customMax" placeholder="Hasta" min="1">
                    <button class="range-btn" onclick="setCustomRange()">Aplicar</button>
                </div>
            </div>

            <div class="control-card">
                <h3>🎲 Acciones</h3>
                <div style="text-align: center;">
                    <button class="main-button" id="sorteoBtn" onclick="realizarSorteo()">
                        🎉 REALIZAR SORTEO 🎉
                    </button>
                    <button class="reset-button" onclick="resetSorteo()">
                        🔄 Reiniciar
                    </button>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalNumbers">100</div>
                <div class="stat-label">Números Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="remainingNumbers">100</div>
                <div class="stat-label">Números Restantes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="drawnNumbers">0</div>
                <div class="stat-label">Números Sorteados</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="progressPercent">0%</div>
                <div class="stat-label">Progreso</div>
            </div>
        </div>

        <div class="result-area">
            <div class="number-display">
                <div class="current-number" id="currentNumber">?</div>
                <div class="number-info" id="numberInfo">Presiona el botón para comenzar el sorteo</div>
            </div>
        </div>

        <div class="history-container">
            <div class="history-title">📋 Números Sorteados</div>
            <div class="history-numbers" id="historyNumbers">
                <span style="color: rgba(255,255,255,0.6);">Ningún número sorteado aún</span>
            </div>
        </div>
    </div>

    <script>
        let minNumber = 0;
        let maxNumber = 100;
        let availableNumbers = [];
        let drawnNumbers = [];
        let isAnimating = false;

        function initializeNumbers() {
            availableNumbers = [];
            for (let i = minNumber; i <= maxNumber; i++) {
                availableNumbers.push(i);
            }
            drawnNumbers = [];
            updateStats();
            updateDisplay();
        }

        function setRange(max) {
            minNumber = 0;
            maxNumber = max;
            
            // Update button states
            document.querySelectorAll('.range-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            initializeNumbers();
        }

        function setCustomRange() {
            const customMin = parseInt(document.getElementById('customMin').value);
            const customMax = parseInt(document.getElementById('customMax').value);
            
            if (isNaN(customMin) || isNaN(customMax) || customMin < 0 || customMax <= customMin) {
                alert('Por favor, introduce un rango válido (mínimo >= 0 y máximo > mínimo)');
                return;
            }
            
            minNumber = customMin;
            maxNumber = customMax;
            
            // Remove active state from preset buttons
            document.querySelectorAll('.range-btn').forEach(btn => btn.classList.remove('active'));
            
            initializeNumbers();
        }

        function updateStats() {
            const total = maxNumber - minNumber + 1;
            const remaining = availableNumbers.length;
            const drawn = drawnNumbers.length;
            const progress = total > 0 ? Math.round((drawn / total) * 100) : 0;
            
            document.getElementById('totalNumbers').textContent = total;
            document.getElementById('remainingNumbers').textContent = remaining;
            document.getElementById('drawnNumbers').textContent = drawn;
            document.getElementById('progressPercent').textContent = progress + '%';
        }

        function updateDisplay() {
            const historyContainer = document.getElementById('historyNumbers');
            
            if (drawnNumbers.length === 0) {
                historyContainer.innerHTML = '<span style="color: rgba(255,255,255,0.6);">Ningún número sorteado aún</span>';
            } else {
                // Mostrar todos los números sorteados (más recientes primero)
                const sortedNumbers = [...drawnNumbers].reverse();
                historyContainer.innerHTML = sortedNumbers
                    .map(num => `<span class="history-number">${num}</span>`)
                    .join('');
            }
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f093fb', '#feca57'][Math.floor(Math.random() * 5)];
                    confetti.style.animationDelay = Math.random() * 3 + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }, i * 10);
            }
        }

        function showMegaNumber(number) {
            const megaNumber = document.createElement('div');
            megaNumber.classList.add('mega-number-animation');
            megaNumber.textContent = number;
            document.body.appendChild(megaNumber);
            
            // Crear confetti durante la animación gigante
            setTimeout(() => {
                createConfetti();
            }, 600);
            
            setTimeout(() => {
                megaNumber.remove();
            }, 3000);
        }

        function showCelebration(number) {
            const celebration = document.createElement('div');
            celebration.classList.add('celebration');
            celebration.textContent = '🎉 ' + number + ' 🎉';
            document.body.appendChild(celebration);
            
            setTimeout(() => {
                celebration.remove();
            }, 2000);
        }

        function animateNumberChange(finalNumber) {
            const numberElement = document.getElementById('currentNumber');
            const infoElement = document.getElementById('numberInfo');
            
            // FASE 1: Animación de números girando rápido
            let animationCount = 0;
            const maxAnimations = 15;
            const animationSpeed = 100;
            
            infoElement.textContent = "🎲 Sorteando número...";
            
            const spinAnimation = () => {
                if (animationCount < maxAnimations) {
                    // Mostrar números aleatorios durante la animación
                    const randomNum = availableNumbers[Math.floor(Math.random() * availableNumbers.length)];
                    numberElement.textContent = randomNum;
                    numberElement.classList.add('spinning');
                    
                    setTimeout(() => {
                        numberElement.classList.remove('spinning');
                    }, animationSpeed);
                    
                    animationCount++;
                    setTimeout(spinAnimation, animationSpeed);
                } else {
                    // FASE 2: OCULTAR el display principal y mostrar el número GIGANTE
                    numberElement.textContent = ""; // Vaciar el display
                    infoElement.textContent = "🎉 ¡NÚMERO SORTEADO! 🎉";
                    showMegaNumber(finalNumber);
                    
                    // FASE 3: Después de 3 segundos, mostrarlo en el display principal
                    setTimeout(() => {
                        numberElement.textContent = finalNumber;
                        numberElement.classList.add('spinning');
                        infoElement.textContent = `¡Número ${finalNumber} sorteado! Quedan ${availableNumbers.length} números disponibles.`;
                        
                        setTimeout(() => {
                            numberElement.classList.remove('spinning');
                        }, 500);
                    }, 3000);
                    
                    // FASE 4: Después de 4 segundos, añadirlo a la lista y finalizar
                    setTimeout(() => {
                        updateDisplay();
                        isAnimating = false;
                        updateButtonState();
                    }, 4000);
                }
            };
            
            spinAnimation();
        }

        function realizarSorteo() {
            if (isAnimating) return;
            
            if (availableNumbers.length === 0) {
                alert('¡No quedan más números para sortear! Usa el botón "Reiniciar" para empezar de nuevo.');
                return;
            }
            
            isAnimating = true;
            updateButtonState();
            
            // Select random number
            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const selectedNumber = availableNumbers[randomIndex];
            
            // Remove from available numbers and add to drawn numbers
            availableNumbers.splice(randomIndex, 1);
            drawnNumbers.push(selectedNumber);
            
            // Iniciar la animación completa
            animateNumberChange(selectedNumber);
            
            // Actualizar estadísticas al final de todo el proceso
            setTimeout(() => {
                updateStats();
            }, 4000);
        }

        function updateButtonState() {
            const button = document.getElementById('sorteoBtn');
            const isDisabled = isAnimating || availableNumbers.length === 0;
            
            button.classList.toggle('disabled', isDisabled);
            
            if (availableNumbers.length === 0 && !isAnimating) {
                button.innerHTML = '🎊 ¡SORTEO COMPLETADO! 🎊';
            } else if (isAnimating) {
                button.innerHTML = '🎲 SORTEANDO... 🎲';
            } else {
                button.innerHTML = '🎉 REALIZAR SORTEO 🎉';
            }
        }

        function resetSorteo() {
            if (confirm('¿Estás seguro de que quieres reiniciar el sorteo? Se perderán todos los números sorteados.')) {
                document.getElementById('currentNumber').textContent = '?';
                document.getElementById('numberInfo').textContent = 'Presiona el botón para comenzar el sorteo';
                initializeNumbers();
                updateButtonState();
            }
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            initializeNumbers();
            updateButtonState();
        });

        // Keyboard shortcut for quick sorting
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isAnimating && availableNumbers.length > 0) {
                e.preventDefault();
                realizarSorteo();
            }
        });
    </script>
</body>
</html>
